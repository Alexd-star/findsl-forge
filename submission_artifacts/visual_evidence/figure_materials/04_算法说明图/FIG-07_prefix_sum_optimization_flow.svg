<text x="324.0" y="1088.0" font-family="Microsoft YaHei, SimSun, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#4b5563" text-anchor="start">
<tspan x="324.0" dy="0.0">这张图不把 prefix-sum 说成所有查询必然加速；它表达的是：当指标配置、窗口和物化列满足条件时走优化路径，否则回退 window 语义，最后用 reference/baseline/Doris 证据核验。</tspan>
</text>
