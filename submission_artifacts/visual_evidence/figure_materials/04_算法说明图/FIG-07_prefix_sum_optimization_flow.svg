<text x="328.0" y="1052.0" font-family="Microsoft YaHei, SimSun, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="800" fill="#172033" text-anchor="start">
<tspan x="328.0" dy="0.0">答辩解释</tspan>
</text>
<text x="328.0" y="1092.0" font-family="Microsoft YaHei, SimSun, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">
<tspan x="328.0" dy="0.0">这张图不把 prefix-sum 说成所有查询必然加速；它表达的是：当指标配置、窗口和物化列满足条件时走优化路径，否则回退 window 语义，最后用 reference/baseline/Doris 证据核验。</tspan>
</text>
<line x1="92.0" y1="1418.0" x2="2308.0" y2="1418.0" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
<text x="92.0" y="1458.0" font-family="Microsoft YaHei, SimSun, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">
<tspan x="92.0" dy="0.0">数据源：configs/indicators.json，src/findsl/sqlgen.py，submission_artifacts/evidence_snapshots/doris_cluster_evidence.json。</tspan>
