name: findsl-demo

services:
  demo:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
      args:
        HTTP_PROXY: ${FINDSL_DOCKER_HTTP_PROXY:-}
        HTTPS_PROXY: ${FINDSL_DOCKER_HTTPS_PROXY:-}
        NO_PROXY: ${FINDSL_DOCKER_NO_PROXY:-127.0.0.1,localhost}
    image: findsl-forge-demo:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../../reports:/app/reports:ro
      - ../../submission_artifacts:/app/submission_artifacts:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
