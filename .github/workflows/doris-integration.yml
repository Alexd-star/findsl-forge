name: Doris integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  hero-query:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install compiler and MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          python -m pip install -e ".[dev]"
      - name: Start Apache Doris
        run: docker compose -f deploy/doris/docker-compose.quickstart.yaml up -d
      - name: Wait for Doris
        run: |
          for attempt in $(seq 1 60); do
            if mysql --host 127.0.0.1 --port 9030 --user root --execute "SHOW BACKENDS"; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f deploy/doris/docker-compose.quickstart.yaml logs
          exit 1
      - name: Load official-shape CI fixture
        run: mysql --host 127.0.0.1 --port 9030 --user root < deploy/doris/official/00_ci_fixture.sql
      - name: Run Hero Query differential and latency gate
        run: >-
          python scripts/run_hero_query.py
          --execute-doris
          --timeout 10
          --json-output reports/hero_query_ci.json
          --report-output reports/hero_query_ci.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: doris-hero-query-evidence
          path: |
            reports/hero_query_ci.json
            reports/hero_query_ci.md
          if-no-files-found: warn
      - name: Stop Apache Doris
        if: always()
        run: docker compose -f deploy/doris/docker-compose.quickstart.yaml down -v
