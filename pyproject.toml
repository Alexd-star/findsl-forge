[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "findsl-forge"
version = "0.1.0"
description = "Deterministic compiler from financial stock-screening DSL to Doris SQL"
requires-python = ">=3.9"
authors = [{ name = "FinDSL Forge Team" }]
dependencies = ["antlr4-python3-runtime==4.13.2", "sqlglot==28.5.0"]

[project.optional-dependencies]
eval = ["pandas>=2.0"]
service = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]
external-data = [
    "akshare==1.18.64",
    "baostock==0.9.3",
    "pandas>=2.0",
    "requests>=2.32",
    "tushare==1.4.29",
]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "httpx2>=2.10,<3",
    "import-linter==2.5.2",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pytest>=8.0",
    "ruff==0.15.13",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["src/findsl/official/frontend/generated"]

[tool.ruff.lint.per-file-ignores]
"src/findsl/**/__init__.py" = ["F401", "F403", "F405"]

[tool.importlinter]
root_packages = ["findsl"]

[[tool.importlinter.contracts]]
name = "Canonical official compiler must not depend on legacy compiler pipelines"
type = "forbidden"
source_modules = [
    "findsl.official",
]
forbidden_modules = [
    "findsl.official_slot",
    "findsl.compiler",
    "findsl.parser",
    "findsl.semantic",
    "findsl.sqlgen",
]
