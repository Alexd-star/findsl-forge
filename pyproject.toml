[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "findsl-forge"
version = "0.1.0"
description = "Deterministic compiler from financial stock-screening DSL to Doris SQL"
requires-python = ">=3.9"
authors = [{ name = "FinDSL Forge Team" }]
dependencies = ["antlr4-python3-runtime==4.13.2", "sqlglot==28.5.0"]

[project.optional-dependencies]
eval = ["pandas>=2.0"]
external-data = [
    "akshare==1.18.64",
    "baostock==0.9.3",
    "pandas>=2.0",
    "requests>=2.32",
    "tushare==1.4.29",
]
dev = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "Pillow>=11.0",
    "pytest>=8.0",
    "ruff==0.15.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["src/findsl/official/frontend/generated"]

[tool.ruff.lint.per-file-ignores]
"src/findsl/**/__init__.py" = ["F401", "F403", "F405"]
"scripts/build_plottie_style_figures.py" = ["E402"]
